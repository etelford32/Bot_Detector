[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "streamlit run dashboard/app_new.py --server.port=8501 --server.address=0.0.0.0"
healthcheckPath = "/_stcore/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[[services]]
name = "web"
type = "web"

[[services]]
name = "api"
type = "web"
startCommand = "uvicorn api.main:app --host 0.0.0.0 --port $PORT"

[[services]]
name = "redis"
type = "redis"
